# Checks the Linux build on every push and pull request. The game is developed on Windows, so a change can build
# and pass there and still break Linux: a renderer change that names a Direct3D 11 item the Linux bindings do not
# have, say. This job catches that when the change is made. It runs tools/linux-build.sh, which builds in the Steam
# Runtime sniper container as a release does, and checks:
#   - cargo fmt --check;
#   - cargo clippy --release --all-targets, with any warning an error (the Linux build has none, so a new one fails);
#   - the tests that need no GPU, window or store (those that need one skip without it);
#   - that crates/mvs-d3d's Linux bindings are what tools/d3d-bindings writes from names.txt;
#   - that no `// Unverified: stub` is left in crates/.
# Then it builds the Linux release folder and offers it as a download to try (see the step "Linux build to try"); it
# publishes no release.
name: Linux

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The runner has 14 GB of disk for the container image (about 4 GB), the toolchains and the builds (about
      # 7 GB): remove preinstalled toolchains this job never uses, for room to spare.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # With the whole history: tools/ci-mtimes.sh diffs this commit against the one the cached build was made from,
      # which can be on another branch (main's cache, for a new branch) and need not be an ancestor of this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # DXVK-native, built by `deps` at the tag the script pins, is kept between runs: `deps` always rebuilds it.
      - name: DXVK tag
        id: dxvk
        run: echo "tag=$(sed -n 's/^DXVK_TAG=//p' tools/linux-build.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dxvk-cache
        with:
          path: target/linux-deps/dxvk
          key: dxvk-${{ steps.dxvk.outputs.tag }}
      - name: Build DXVK-native
        if: steps.dxvk-cache.outputs.cache-hit != 'true'
        run: tools/linux-build.sh deps

      # The builds (Clippy's and the tests') are kept between runs, the workspace's own crates and test binaries
      # included: compiling those is most of the job. The newest entry with the same lock, toolchain and build script
      # is restored, and tools/ci-mtimes.sh makes Cargo rebuild only what reads a file changed since its commit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: target-cache
        with:
          path: target/linux-sniper
          key: >-
            linux-target-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml',
            'tools/linux-build.sh') }}-${{ github.sha }}
          restore-keys: >-
            linux-target-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml',
            'tools/linux-build.sh') }}-
      - name: Cached build's file times
        run: tools/ci-mtimes.sh

      - name: Format
        run: tools/linux-build.sh cargo fmt --check
      - name: Clippy
        id: clippy
        run: tools/linux-build.sh cargo clippy --release --all-targets -- -D warnings
      # Without incremental data and debug info, which a run that starts cold never uses: the test build is about
      # 6 GB, not 40. Built in a step of its own, so the cache is saved only when every build in it succeeded (below);
      # the next step's build is then up to date.
      - name: Build the tests
        id: test-build
        run: >-
          tools/linux-build.sh cargo test --profile trace --config profile.trace.incremental=false
          --config profile.trace.debug=false --workspace --no-fail-fast --no-run
      - name: Tests
        id: tests
        run: >-
          tools/linux-build.sh cargo test --profile trace --config profile.trace.incremental=false
          --config profile.trace.debug=false --workspace --no-fail-fast
      # The release build, as tools/linux-build.sh release makes it on a desktop, at the workspace's version. Run when
      # Clippy's and the tests' builds succeeded, even if a test failed, so the cache below keeps this build too; the
      # cache is then saved only if this build succeeded as well. The download below, though, is offered only when the
      # tests passed too: a build whose tests failed is never handed to a player.
      - name: Build the release folder
        id: release
        if: always() && steps.clippy.outcome == 'success' && steps.test-build.outcome == 'success'
        run: tools/linux-build.sh release
      # A Linux build to try, from every push and pull request. Find it on the run's page on GitHub (the Actions tab,
      # then this run), under "Artifacts", as mvs-classic-linux; it downloads as a .zip with the .tar.gz inside.
      # It is a test build, not a release: it has no EOS files (Epic's online services), so online play goes
      # through the relay only.
      # Packed with tar first because GitHub's artifact upload drops Unix file permissions, and a player needs the
      # two programs ("MVSC Launcher" and game/"MVS Classic") marked executable to start them; a .tar.gz keeps
      # that mark. Unpack it with: tar -xzf MVS-Classic-<version>-linux-<commit>.tar.gz
      - name: Linux build to try
        id: pack
        if: always() && steps.release.outcome == 'success' && steps.tests.outcome == 'success'
        run: |
          version=$(jq -r .version target/linux-release/game/linux-build.json)
          name="MVS-Classic-$version-linux-$(git rev-parse --short HEAD)"
          tar -czf "target/$name.tar.gz" -C target/linux-release "MVSC Launcher" game
          echo "file=target/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.pack.outcome == 'success'
        with:
          name: mvs-classic-linux
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
      # Saved when all three builds (Clippy's, the tests', the release's) succeeded, failing tests or not: a build
      # that failed or was cancelled can leave a crate built from an older commit than the one recorded, which
      # tools/ci-mtimes.sh would then take as up to date.
      - name: Record the cached build's commit
        if: >-
          always() && steps.clippy.outcome == 'success' && steps.test-build.outcome == 'success'
          && steps.release.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true'
        run: git rev-parse HEAD > target/linux-sniper/.ci-commit
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          always() && steps.clippy.outcome == 'success' && steps.test-build.outcome == 'success'
          && steps.release.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true'
        with:
          path: target/linux-sniper
          key: ${{ steps.target-cache.outputs.cache-primary-key }}
      # On the runner itself: the generator is not part of the workspace, and rust-toolchain.toml picks its compiler
      # and the rustfmt it formats with.
      - name: D3D bindings
        run: |
          rustup toolchain install
          cargo run --manifest-path tools/d3d-bindings/Cargo.toml -- --check
      - name: No stubs left
        run: "! grep -rn '// Unverified: stub' crates/"
