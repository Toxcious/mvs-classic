# Builds a release from its tag on GitHub's own machines and attests what it makes (where it was built, from which
# commit, by this workflow), so anyone can check that a release came from this repo's code:
#   gh attestation verify MVS-Classic-<version>.zip --repo <owner>/<repo>
#   gh attestation verify "MVS Classic.exe" --repo <owner>/<repo>
# The jobs windows and relay-linux build and attest the programs; pack lays out and zips the release with
# `mvs-dist build --programs` and attests both zips. Pack adds the self check's reference committed with the tag
# (self-check.json, made on the maintainer's machine by playing the check match on an imported store; mvs-dist holds
# it to the game's own id) and Epic's SDK and credentials, from the repo's secrets: EOS_CREDENTIALS (the eos.json
# text) and EOS_SDK_PASSPHRASE (the passphrase of release/EOSSDK-Win64-Shipping.dll.gpg, Epic's DLL encrypted with
# gpg). Without those secrets pack stops before packing and tools/release-fetch.ps1 packs on the maintainer's
# machine from the attested programs. Started only by a version tag.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: sccache

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build
        shell: bash
        run: |
          export MVS_VERSION="${GITHUB_REF_NAME#v}"
          export MVS_UPDATE_FEED="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          # the C runtime linked in, as mvs-dist builds it (no Visual C++ Redistributable needed)
          export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --release --locked -p mvs-app --bin mvs --bin mvs-launcher
          cargo build --release --locked -p mvs-relay --bin mvs-relay
          mkdir programs
          cp target/release/mvs.exe target/release/mvs-launcher.exe target/release/mvs-relay.exe programs/
          for p in mvs mvs-launcher mvs-relay; do
            line=$("programs/$p.exe" --version | head -n 1)
            case "$line" in
              "$p $MVS_VERSION" | "$p $MVS_VERSION "*) echo "$line" ;;
              *) echo "$p.exe says \"$line\", not \"$p $MVS_VERSION\"" >&2; exit 1 ;;
            esac
          done
          sha256sum programs/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: programs/*.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: programs-windows
          path: programs/
          if-no-files-found: error

  relay-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build
        run: |
          export MVS_VERSION="${GITHUB_REF_NAME#v}"
          # one static file, as tools/relay-linux.ps1 builds it
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld
          export CARGO_PROFILE_RELEASE_DEBUG=0
          export CARGO_PROFILE_RELEASE_STRIP=symbols
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p mvs-relay
          mkdir programs
          cp target/x86_64-unknown-linux-musl/release/mvs-relay programs/
          line=$(programs/mvs-relay --version | head -n 1)
          case "$line" in
            "mvs-relay $MVS_VERSION" | "mvs-relay $MVS_VERSION "*) echo "$line" ;;
            *) echo "mvs-relay says \"$line\", not \"mvs-relay $MVS_VERSION\"" >&2; exit 1 ;;
          esac
          sha256sum programs/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: programs/mvs-relay
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: programs-relay-linux
          path: programs/
          if-no-files-found: error

  pack:
    needs: [windows, relay-linux]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Epic files
        id: eos
        shell: bash
        env:
          EOS_CREDENTIALS: ${{ secrets.EOS_CREDENTIALS }}
          EOS_SDK_PASSPHRASE: ${{ secrets.EOS_SDK_PASSPHRASE }}
        run: |
          if [ -z "$EOS_CREDENTIALS" ] || [ -z "$EOS_SDK_PASSPHRASE" ]; then
            echo "no Epic secrets: the release is packed on the maintainer's machine"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.eos.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.eos.outputs.ready == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - if: steps.eos.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: programs-windows
          path: programs
      - if: steps.eos.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: programs-relay-linux
          path: relay-linux
      - name: Pack
        if: steps.eos.outputs.ready == 'true'
        shell: bash
        env:
          EOS_CREDENTIALS: ${{ secrets.EOS_CREDENTIALS }}
          EOS_SDK_PASSPHRASE: ${{ secrets.EOS_SDK_PASSPHRASE }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          eos="$RUNNER_TEMP/eos"
          mkdir -p "$eos"
          printf '%s' "$EOS_CREDENTIALS" > "$eos/eos.json"
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$EOS_SDK_PASSPHRASE"             --output "$eos/EOSSDK-Win64-Shipping.dll" --decrypt release/EOSSDK-Win64-Shipping.dll.gpg
          export MVS_EOS_DLL="$eos/EOSSDK-Win64-Shipping.dll" MVS_EOS_CREDENTIALS="$eos/eos.json"
          cargo build --release --locked -p mvs-dist --bin mvs-dist
          target/release/mvs-dist.exe build --version "$version"             --feed "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"             --programs programs --relay-linux relay-linux/mvs-relay --self-check self-check.json --eos --out dist
          rm -rf "$eos"
          mkdir zips
          cp dist/*.zip zips/
          sha256sum zips/*
      - if: steps.eos.outputs.ready == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: zips/*.zip
      - if: steps.eos.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zips
          path: zips/
          if-no-files-found: error
