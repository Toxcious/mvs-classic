# cargo deny check: the licences the dependencies may carry, known advisories, and where crates come from.

[graph]
all-features = true

[advisories]
# A known vulnerability fails the check; an unmaintained crate only does for a direct dependency.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    # the vendored FreeType (mvs-freetype), taken under the FreeType License
    "FTL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
