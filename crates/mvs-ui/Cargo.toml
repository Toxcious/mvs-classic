[package]
name = "mvs-ui"
description = "The UI: a Slate subset over the ui kind's widget trees (layout, animations, paint to an element list), its text (FreeType faces from the font kind, Game.locres), the element batches drawn on Direct3D 11 with the build's Slate shaders and UI materials, the match HUD and the results screen."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
indexmap.workspace = true
mvs-data.workspace = true
mvs-d3d.workspace = true
mvs-freetype.workspace = true
mvs-material.workspace = true
# the online menus' view of the net service (its requests, events and targets)
mvs-net.workspace = true
mvs-protocol.workspace = true
mvs-render.workspace = true
mvs-settings.workspace = true
mvs-sim = { path = "../mvs-sim" }
mvs-store.workspace = true
mvs-view.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_SystemInformation",
] }
zstd.workspace = true

[dev-dependencies]
mvs-sim-trace = { path = "../mvs-sim-trace" }
mvs-trace.workspace = true
