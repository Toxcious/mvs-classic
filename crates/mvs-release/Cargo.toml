[package]
name = "mvs-release"
description = "What a release of the game is: its version and update feed (set when it is built), the GitHub release the updater reads, and the names of the files a release folder holds."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# the zip module: deflate and CRC-32
flate2.workspace = true

[target.'cfg(windows)'.dependencies]
# the local time a zip entry is stamped with
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_SystemInformation"] }
