[package]
name = "mvs-net"
description = "Online play: rollback over the deterministic sim (the session), the input codec, the events under rollback, the links that carry a match's packets (an in-memory network for the tests, the relay client)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mvs-sim = { path = "../mvs-sim" }
mvs-protocol.workspace = true
# the host core a hosting player runs
mvs-host.workspace = true
# the direct host: a relay core in process, served on a current-thread runtime
mvs-relay.workspace = true
tokio.workspace = true
socket2.workspace = true
# this PC's network interfaces (the direct host's addresses, the LAN broadcast targets)
if-addrs = "=0.15.0"
# the EOS backend's SDK, loaded at run time
libloading.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true

[dev-dependencies]
mvs-sim-trace = { path = "../mvs-sim-trace" }
mvs-trace.workspace = true
mvs-store.workspace = true
mvs-data.workspace = true
