    { path = "f64::cosh", reason = "use mvs_sim::math::dbl::libm (the sim's own routines)" },
    { path = "f64::tanh", reason = "use mvs_sim::math::dbl::libm (the sim's own routines)" },
    { path = "f64::asinh", reason = "use mvs_sim::math::dbl::libm (the sim's own routines)" },
    { path = "f64::acosh", reason = "use mvs_sim::math::dbl::libm (the sim's own routines)" },
