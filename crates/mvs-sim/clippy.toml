# The deterministic crates' clippy rules (mvs-sim, mvs-anim, mvs-collision and mvs-vfx hold the same file: clippy
# reads the nearest one and merges none; mvs-sim's tests check the four are the same).
#
# Their numbers must come out with the same bits on every machine: the math goes through mvs-math (`mvs_sim::math`
# in the sim crates, which re-exports it; `mvs_math` itself in mvs-vfx), never the standard library's routines, whose
# results differ by platform. Exact operations stay allowed (sqrt, abs, floor, ceil, trunc, copysign, the arithmetic
# and %). A std HashMap or HashSet is not used at all: its order is random per run, and a walk, a union or an
# into_iter hands it on; a map is an IndexMap (insertion order). A float to integer cast (`as i32`) is the casts
# lints' in mvs-sim's lib.rs.
disallowed-methods = [
    { path = "f64::sin", reason = "use mvs_sim::math (the sim's own routines)" },
    { path = "f64::cos", reason = "use mvs_sim::math (the sim's own routines)" },
    { path = "f64::tan", reason = "use mvs_sim::math::dbl::libm (the sim's own routines)" },
    { path = "f64::sin_cos", reason = "use mvs_sim::math (the sim's own routines)" },
    { path = "f64::asin", reason = "use mvs_sim::math::dbl::libm (the sim's own routines)" },
    { path = "f64::acos", reason = "use mvs_sim::math (the sim's own routines)" },
    { path = "f64::atan", reason = "use mvs_sim::math (the sim's own routines)" },
    { path = "f64::atan2", reason = "use mvs_sim::math (the sim's own routines)" },
