[package]
name = "mvs-relay"
description = "The relay anyone may run: players' lobbies, searches, invites, the links that carry their packets and the referees of their matches, over TCP and UDP."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mvs-relay"
path = "src/bin/mvs-relay.rs"

[dependencies]
mvs-release.workspace = true
mvs-protocol.workspace = true
# the host cores the relay runs (hosted.rs)
mvs-host.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "signal"] }
socket2.workspace = true
